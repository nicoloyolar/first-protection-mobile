; Firmware del dispositivo First Protection.
; Placa de desarrollo: NUCLEO-F401RE (STM32F401RE).

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = stm32cube
; Graba copiando el .bin a la unidad del ST-Link (no requiere driver de depuracion).
upload_protocol = mbed
monitor_speed = 115200
build_src_flags = -Wall -Wextra
; newlib-nano no formatea floats por defecto (coordenadas y velocidad del GPS).
build_flags = -Wl,-u,_printf_float
