name: CI

# Hasta ahora este repo no corria ningun chequeo automatico: los 26 tests de
# functions/test/device-api.test.js y los 5 de test/models_test.dart solo se
# ejecutaban a mano. Este workflow los corre en cada push/PR a main, y ademas
# agrega un smoke test end-to-end contra el emulador real de Cloud Functions
# (exports.deviceApi), cerrando el pendiente documentado en
# docs/plan-de-trabajo.md ("los tests nunca prueban el wrapper real de Cloud
# Functions, solo handleApiRequest directo").

on:
  push:
    branches: [main]
  pull_request:

jobs:
  functions-tests:
    name: Functions - unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  functions-emulator-smoke:
    name: Functions - smoke test contra el emulador real (exports.deviceApi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # El emulador de Realtime Database del Firebase CLI corre sobre JVM y
      # firebase-tools exige JDK >= 21 (ver error real: "firebase-tools no
      # longer supports Java version before 21").
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
        working-directory: functions
      - run: npm install -g firebase-tools
      # --project con prefijo "demo-" corre el emulador 100% offline, sin
      # necesitar credenciales reales de GCP ni tocar el proyecto real.
      # functions/.secret.local provee el override de DEVICE_SIM_SECRET
      # (mismo valor "dev-secret" que ya usa toda la suite local) para que
      # el emulador no intente pedirle el secreto real a Secret Manager.
      - run: firebase emulators:exec --project demo-first-protection --only functions,database "node functions/test/emulator-smoke.js"

  flutter-checks:
    name: Flutter - analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
